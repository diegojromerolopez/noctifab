config_version: "2.0"
execution_report: .noctifab/reports/execution_report.md
agents:
  architecture: code_first
  spike:
    enabled: false
  orchestrator:
    number: 3
    iterations: 2
  product_manager:
    audit_mode: smart
    number: 1
    iterations: 1
    passes: 1
    providers:
      - name: claude
        model: claude-haiku-5-5
      - name: openai
        model: gpt-5.6-luna
    user_stories:
      max_count: 5
      complexity:
        min: 15
        max: 35
  planner:
    number: 1
    iterations: 5
    providers:
      - name: claude
        model: claude-haiku-5-5
      - name: openai
        model: gpt-5.6-luna
  generators:
    number: 3
    iterations: 10
    providers:
      - name: openai
        model: gpt-5.6-luna
      - name: claude
        model: claude-sonnet-5
  testers:
    number: 2
    iterations: 8
    providers:
      - name: openai
        model: gpt-5.6-luna
      - name: claude
        model: claude-sonnet-5
  escalation:
    enabled: true
    clean_worktree_on_escalate: false
    thinking_threshold_turns: 1
    model_upgrade_threshold_turns: 1
    max_model_upgrades: 2
    upgraded_models:
      - claude-sonnet-5
  qa:
    providers:
      - name: claude
        model: claude-haiku-5-5
      - name: openai
        model: gpt-5.6-luna
  auditor:
    providers:
      - name: claude
        model: claude-haiku-5-5
      - name: openai
        model: gpt-5.6-luna
sandbox:
  mode: host
  timeout_seconds: 300
  test_command: make test
  formatter_command: make format
  syntax_check_command: gcc -fsyntax-only {file}
  linter:
    command: make lint
  e2e:
    mode: native
  allowed_commands:
    - make
    - gcc
    - clang
    - clang-format
    - clang-tidy
    - git
    - sh
    - bash
    - curl
    - python
    - python3
    - pytest
vcs:
  provider: local
  use_worktrees: true
  base_branch: main
  branch_prefix: noctifab/
llm:
  thinking:
    enabled: false
  priority:
    - openai
    - claude
  providers:
    - name: openai
      provider: openai
      model: gpt-5.6-luna
      enable_thinking: false
      thinking_budget: 0
      api_keys:
        - OPENAI_API_KEY
    - name: claude
      provider: anthropic
      model: claude-sonnet-5
      enable_thinking: false
      thinking_budget: 0
      api_keys:
        - ANTHROPIC_API_KEY
        - CLAUDE_API_KEY
runtime:
  spec_source: SPEC.md
  max_actions: 100
  loop:
    count: 3
