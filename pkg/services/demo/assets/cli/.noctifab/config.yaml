config_version: "2.0"
execution_report: report/execution_report.md
agents:
  architecture: code_first
sandbox:
  mode: host
  timeout_seconds: 300
  test_command: go test -v ./...
  formatter_command: go fmt ./...
  allowed_commands:
    - go
    - git
vcs:
  provider: local
  use_worktrees: true
  base_branch: main
  branch_prefix: noctifab/
llm:
  priority:
    - claude
    - openai
  providers:
    - name: claude
      provider: anthropic
      model: claude-sonnet-5
      api_keys:
        - ANTHROPIC_API_KEY
        - CLAUDE_API_KEY
    - name: openai
      provider: openai
      model: gpt-5.6-luna
      api_keys:
        - OPENAI_API_KEY
runtime:
  spec_source: SPEC.md
  max_actions: 100
  loop:
    count: 1
