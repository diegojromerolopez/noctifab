config_version: "2.0"
execution_report: .noctifab/reports/execution_report.md
agents:
  architecture: code_first
  spike:
    enabled: false
  product_manager:
    audit_mode: smart
    number: 1
    iterations: 1
    passes: 1
    providers:
      - name: claude
        model: claude-haiku-5-5
      - name: openai
        model: gpt-5.6-luna
  planner:
    number: 1
    iterations: 5
    providers:
      - name: claude
        model: claude-haiku-5-5
      - name: openai
        model: gpt-5.6-luna
  qa:
    providers:
      - name: claude
        model: claude-haiku-5-5
      - name: openai
        model: gpt-5.6-luna
  auditor:
    providers:
      - name: claude
        model: claude-haiku-5-5
      - name: openai
        model: gpt-5.6-luna
sandbox:
  mode: host
  timeout_seconds: 300
  test_command: go test -v ./...
  formatter_command: go fmt ./...
  allowed_commands:
    - go
    - git
  e2e:
    mode: native
vcs:
  provider: local
  use_worktrees: true
  base_branch: main
  branch_prefix: noctifab/
llm:
  thinking:
    enabled: false
  priority:
    - claude
    - openai
  providers:
    - name: claude
      provider: anthropic
      model: claude-sonnet-5
      enable_thinking: false
      thinking_budget: 0
      api_keys:
        - ANTHROPIC_API_KEY
        - CLAUDE_API_KEY
    - name: openai
      provider: openai
      model: gpt-5.6-luna
      enable_thinking: false
      thinking_budget: 0
      api_keys:
        - OPENAI_API_KEY
runtime:
  spec_source: SPEC.md
  max_actions: 100
  loop:
    count: 3
