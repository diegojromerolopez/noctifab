config_version: "1.0"
orchestrator:
    max_tools_per_response: 5
    concurrency: 2
    poll_interval: 5m0s
    max_clarification_wait: 30m0s
    clarification_timeout_action: abort
storage:
    provider: sqlite
    conn_string: .noctifab/data/noctifab.db
    json_file_path: .noctifab/data/state.json
llms:
    - provider: opencode
      model: glm-5.2
      temperature: 0
      api_key: "secret:OPENCODE_API_KEY"
      url: ""
      max_retries: 5
      retry_backoff: 100ms
      retry_backoff_factor: 2
      max_budget_usd: 10
    - provider: gemini
      model: gemini-2.5-flash
      temperature: 0
      api_key: "secret:GEMINI_API_KEY"
      url: ""
      max_retries: 5
      retry_backoff: 100ms
      retry_backoff_factor: 2
      max_budget_usd: 10
vcs:
    provider: github
    repository: diegojromerolopez/wc
    base_branch: main
    branch_prefix: noctifab/
    token: "secret:GITHUB_TOKEN"
    token_env: GITHUB_TOKEN
    conventional_commits:
        enabled: true
        default_scope: core
    git_mutex_timeout: 30s
    git_operation_retries: 3
    git_retry_backoff: 500ms
sandbox:
    mode: host
    timeout_seconds: 300
    grace_period_seconds: 30
    test_command: cargo test
    linter_command: "cargo fmt --check && cargo clippy -- -D warnings"
    exclude_paths:
        - target/
        - .noctifab/
    allowed_commands:
        - cargo
        - rustc
        - git
    forbidden_patterns:
        - '\bunsafe\s*\{'
roles:
    orchestrator:
        model: ""
        temperature: 0
        profile: orchestrator
    planner:
        model: ""
        temperature: 0.5
        profile: planner
    generator:
        model: ""
        temperature: 0
        profile: generator
    tester:
        model: ""
        temperature: 0
        profile: tester
input: ""
auto_commit: false
max_actions: 100
max_duration: 0s
conversation_mode: sliding-window
max_history_messages: 10
compaction_threshold: 15
max_history_tokens: 4096
shutdown_grace_period: 30s
occ_max_retries: 5
occ_backoff_base: 50ms
occ_backoff_factor: 2
token_usage_limit: 0
log_level: info
log_file: ""
