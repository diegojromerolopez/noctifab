config_version: '2.0'
execution_report: /app/report_mount/execution_report.md
agents:
  architecture: code_first
  orchestrator:
    number: 3
    iterations: 2
  product_manager:
    number: 1
    iterations: 2
    user_stories:
      max_count: 5
      complexity:
        min: 15
        max: 35
    max_tokens: -1
    providers:
    - name: claude
    - name: openai
    - name: gemini
    - name: deepseek-pro
    - name: qwen
    - name: opencode
    - name: openrouter
  planner:
    number: 1
    iterations: 5
    providers:
    - name: openai
    - name: claude
    - name: gemini
    - name: deepseek-pro
    - name: qwen
    - name: opencode
    - name: openrouter
  generators:
    number: 4
    iterations: 20
    max_tokens: -1
    providers:
    - name: deepseek-pro
    - name: qwen
    - name: gemini-flash
    - name: claude
    - name: openai
    - name: opencode
    - name: openrouter
  testers:
    number: 2
    iterations: 15
    max_tokens: -1
    providers:
    - name: gemini-flash
    - name: openai
    - name: claude
    - name: deepseek-pro
    - name: qwen
    - name: opencode
    - name: openrouter
  qa:
    enabled: false
    iterations: 2
    providers:
    - name: gemini-flash
    - name: claude
    - name: openai
  auditor:
    number: 1
    iterations: 2
    max_tokens: -1
    providers:
    - name: claude
    - name: openai
    - name: gemini
    - name: deepseek-pro
  unblocker:
    number: 1
    iterations: 2
    max_tokens: -1
    providers:
    - name: gemini-flash
    - name: claude
    - name: openai
  fallback:
    enabled: true
    temperature: 0.1
    max_turns: 2
    timeout: 180s
    allow_spec_mutation: true
    allow_scope_reduction: true
    enforce_spec_quality: true
    providers:
    - name: gemini-flash
    - name: claude
    - name: openai
  spike:
    enabled: true
    timeout_seconds: 45
    providers:
    - name: gemini-flash
    - name: claude
    - name: gemini
    - name: openai
    - name: deepseek-pro
    - name: qwen
    - name: opencode
    - name: openrouter
fallback:
  enabled: true
  poll_interval: 30s
  max_retries: 3
  stall_threshold: 5m
  conflict_threshold: 15m
  llm_assessment: true
  triggers:
    retries_exhaustion: true
    cyclic_loop_detection: true
    missing_toolchain_fast_abort: true
    qa_deadlock_turns: 2
    watchdog_timeout_turns: 2
    stall_count_threshold: 4
  sovereign_rescue:
    enabled: true
    max_turns: 10
    timeout: 5m
    missing_toolchain_strategy: auto
    providers:
      - name: gemini
        temperature: 0.3
workspace_cache:
  enabled: true
poll_interval: 1s
max_clarification_wait: 30m0s
clarification_timeout_action: continue
storage:
  provider: sqlite
  conn_string: .noctifab/data/noctifab.db
  json_file_path: .noctifab/data/state.json
  occ:
    max_retries: 20
    backoff_base: 100ms
    backoff_factor: 2
llm:
  token_usage_limit: 0
  priority:
  - claude
  - openai
  - deepseek-pro
  - gemini-flash
  - gemini
  - qwen
  - opencode
  - openrouter
  providers:
  - name: claude
    provider: anthropic
    model: claude-sonnet-5
    api_keys: CLAUDE_API_KEY
    max_retries: 3
    retry_backoff: 500ms
    max_timeout: 60s
    idle_timeout: 60s
    max_tokens: -1
    temperature: 0.2
    streaming: true
  - name: openai
    provider: openai
    model: gpt-5.6-luna
    api_keys: OPENAI_API_KEY
    max_retries: 3
    retry_backoff: 500ms
    max_timeout: 60s
    idle_timeout: 60s
    max_tokens: -1
    temperature: 0.2
    streaming: true
  - name: deepseek-pro
    provider: qwencloud
    model: deepseek-v4-pro
    api_keys: QWENCLOUD_API_KEY
    max_retries: 3
    retry_backoff: 500ms
    max_timeout: 60s
    idle_timeout: 60s
    max_tokens: -1
    temperature: 0.2
    streaming: true
  - name: gemini-flash
    provider: gemini
    model: gemini-3.6-flash
    api_keys: GEMINI_API_KEY
    max_retries: 3
    retry_backoff: 500ms
    max_timeout: 60s
    idle_timeout: 60s
    max_tokens: -1
    temperature: 0.2
    streaming: true
  - name: gemini
    provider: gemini
    model: gemini-3.6-pro
    api_keys: GEMINI_API_KEY
    max_retries: 3
    retry_backoff: 500ms
    max_timeout: 60s
    idle_timeout: 60s
    max_tokens: -1
    temperature: 0.2
    streaming: true
  - name: qwen
    provider: qwencloud
    model: qwen3.8-max
    api_keys: QWENCLOUD_API_KEY
    max_retries: 3
    retry_backoff: 500ms
    max_timeout: 60s
    idle_timeout: 60s
    max_tokens: -1
    temperature: 0.2
    streaming: true
    enable_thinking: true
    thinking_budget: 2048
  - name: opencode
    provider: opencode
    model: glm-5.2
    api_keys: OPENCODE_ZEN_API_KEY
    max_retries: 3
    retry_backoff: 500ms
    max_timeout: 60s
    idle_timeout: 60s
    max_tokens: -1
    temperature: 0.2
    streaming: true
  - name: openrouter
    provider: openrouter
    model: deepseek/deepseek-v4-flash-0731
    api_keys: OPENROUTER_API_KEY
    max_retries: 3
    retry_backoff: 500ms
    max_timeout: 60s
    idle_timeout: 60s
    max_tokens: -1
    temperature: 0.2
    streaming: true
vcs:
  provider: github
  repository: diegojromerolopez/ninline
  base_branch: main
  branch_prefix: noctifab/
  use_worktrees: true
  token: secret:GITHUB_TOKEN
  token_env: GITHUB_TOKEN
  pull_request:
    auto_create: false
sandbox:
  mode: host
  timeout_seconds: 300
  test_command: make test
  formatter_command: make format
  syntax_check_command: python3 -m py_compile {file}
  linter:
    command: make lint
    max_issues: 100
    consecutive_failures: 2
    max_retries: 3
  e2e:
    mode: docker
  telemetry:
    inject: true
    trace_format: jsonl
  exclude_paths:
  - node_modules/
  - vendor/
  - bin/
  - dist/
  - build/
  - .noctifab/
  - .git/
  - data/
  - __pycache__/
  - .venv/
  - venv/
  - .pytest_cache/
  - .mypy_cache/
  - .ruff_cache/
  allowed_commands:
  - make
  - python3
  - python
  - pip
  - pip3
  - pytest
  - ruff
  - mypy
  - git
  - sh
  - bash
  - curl
  - docker
runtime:
  spec_source: ''
  max_actions: 100
  max_duration: 10m
  max_silent_stall_duration: 10m
  max_tokens_per_story: -1
  max_tokens_per_task: -1
  max_tokens: -1
  loop:
    count: 1
logging:
  level: info
  file: ''
telemetry:
  enabled: false
  exporter: otlp
  endpoint: ''
  service_name: noctifab
  metrics:
    enabled: true
context:
  mode: tree_sitter
  tree_sitter: true
  diff_window_lines: 40
  window_size: 40
  compaction: none
