version: '3.8'

services:
  sqlasm-runner:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "===> Running Assembly Compilation & Linker"
        make build
        
        echo "===> Running Valgrind & Assembly Unit Tests"
        make test
        make lint
        
        echo "===> SUCCESS: All Assembly B-Tree DBMS checks passed!"
