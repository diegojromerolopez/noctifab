AllCops:
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'db/**/*'
    - 'bin/**/*'
    - '.noctifab/**/*'

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Enabled: false

Layout/TrailingEmptyLines:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/SpecialGlobalVars:
  Enabled: false

Style/ExpandPathArguments:
  Enabled: false

Style/StderrPuts:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/GlobalStdStream:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/SpaceAroundOperators:
  Enabled: false

Style/Alias:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Style/FloatDivision:
  Enabled: false

Style/QuotedSymbols:
  Enabled: false

Lint/SymbolConversion:
  Enabled: false

Style/WordArray:
  Enabled: false

Lint/ConstantDefinitionInBlock:
  Enabled: false

Lint/ScriptPermission:
  Enabled: false







