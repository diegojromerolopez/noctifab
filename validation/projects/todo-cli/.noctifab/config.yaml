config_version: "1.0"
agents:
    architecture: code_first
    max_tools_per_response: 5
    orchestrator:
        number: 1
        iterations: 2
    product_manager:
        number: 1
        iterations: 2
        max_user_stories: 5
    planner:
        number: 1
        iterations: 2
    architect:
        number: 1
        iterations: 2
    generators:
        number: 4
        iterations: 5
    testers:
        number: 2
        iterations: 3
    qa:
        number: 1
        iterations: 2
    security:
        number: 1
        iterations: 2
    performance:
        number: 1
        iterations: 2
    docs:
        number: 1
        iterations: 2
    devops:
        number: 1
        iterations: 2
    unblocker:
        number: 1
        iterations: 2
workspace_cache:
    enabled: true
poll_interval: 5m0s
max_clarification_wait: 30m0s
clarification_timeout_action: abort
storage:
    provider: sqlite
    conn_string: .noctifab/data/noctifab.db
    json_file_path: .noctifab/data/state.json
llm:
    priority:
        - gemini-primary
        - opencode-primary
        - openrouter-backup
    providers:
        - name: gemini-primary
          provider: gemini
          model: latest
          api_keys: GEMINI_API_KEY
          max_retries: 2
          retry_backoff: 50ms
          max_timeout: 25s
          idle_timeout: 8s
          streaming: true
        - name: opencode-primary
          provider: opencode
          model: latest
          api_keys: OPENCODE_API_KEY
          max_retries: 2
          retry_backoff: 50ms
          max_timeout: 25s
          idle_timeout: 8s
          streaming: true
        - name: openrouter-backup
          provider: openrouter
          model: deepseek/deepseek-v4-flash-latest
          api_keys: OPENROUTER_API_KEY
          max_retries: 2
          retry_backoff: 50ms
          max_timeout: 25s
          idle_timeout: 8s
          streaming: true
vcs:
    provider: github
    repository: diegojromerolopez/todo-cli
    base_branch: main
    branch_prefix: noctifab/
    use_worktrees: true
    token: "secret:GITHUB_TOKEN"
    token_env: GITHUB_TOKEN
    conventional_commits:
        enabled: true
        default_scope: core
    git_mutex_timeout: 30s
    git_operation_retries: 3
    git_retry_backoff: 500ms
sandbox:
    mode: host
    timeout_seconds: 300
    grace_period_seconds: 30
    test_command: "go mod tidy && go test ./..."
    linter_command: "go mod tidy && go vet ./..."
    formatter_command: "go fmt ./..."
    max_linter_retries: 3
    exclude_paths:
        - node_modules/
        - vendor/
        - bin/
        - dist/
        - .noctifab/
        - .git/
    allowed_commands:
        - go
        - git
input: ""
auto_commit: false
max_actions: 100
max_duration: 0s
conversation_mode: sliding-window
max_history_messages: 10
compaction_threshold: 15
max_history_tokens: 4096
shutdown_grace_period: 30s
occ_max_retries: 5
occ_backoff_base: 50ms
occ_backoff_factor: 2
token_usage_limit: 0
log_level: info
log_file: ""
telemetry:
    enabled: false
    exporter: otlp
    endpoint: ""
    service_name: noctifab
    metrics:
        enabled: true
context:
    mode: full
    diff_window_lines: 15
    compaction: simple_english


