version: '3.8'

services:
  auth-vault:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ISSUER=http://auth-vault:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/.well-known/openid-configuration"]
      interval: 2s
      timeout: 2s
      retries: 10

  e2e-runner:
    image: alpine:latest
    depends_on:
      auth-vault:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl jq
        echo "===> Testing OIDC Discovery Endpoint"
        curl -sS http://auth-vault:8080/.well-known/openid-configuration | jq .
        
        echo "===> Testing JWKS Endpoint"
        curl -sS http://auth-vault:8080/.well-known/jwks.json | jq .
        
        echo "===> SUCCESS: All E2E checks passed!"
