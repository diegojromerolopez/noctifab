config_version: "1.0"
agents:
    architecture: single_pass_execution
    max_tools_per_response: 10
    architect:
        number: 1
        iterations: 2
    generators:
        number: 4
        iterations: 5
    testers:
        number: 2
        iterations: 3
    qa:
        number: 2
        iterations: 2
    security:
        number: 1
        iterations: 2
    performance:
        number: 1
        iterations: 2
    docs:
        number: 1
        iterations: 2
    devops:
        number: 1
        iterations: 2
poll_interval: 10s
max_clarification_wait: 30m0s
clarification_timeout_action: continue
storage:
    provider: sqlite
    conn_string: .noctifab/data/noctifab.db
    json_file_path: .noctifab/data/state.json
llms:
    - provider: opencode
      model: glm-5.2
      temperature: 0
      api_key: "secret:OPENCODE_API_KEY"
      url: ""
      max_retries: 5
      retry_backoff: 100ms
      retry_backoff_factor: 2
      max_budget_usd: 10
      max_timeout: 60s
      idle_timeout: 15s
      streaming: true
    - provider: gemini
      model: gemini-2.5-flash
      temperature: 0
      api_key: "secret:GEMINI_API_KEY"
      url: ""
      max_retries: 5
      retry_backoff: 100ms
      retry_backoff_factor: 2
      max_budget_usd: 10
      max_timeout: 60s
      idle_timeout: 15s
      streaming: true
vcs:
    provider: github
    repository: diegojromerolopez/fortune
    base_branch: main
    branch_prefix: noctifab/
    use_worktrees: true
    token: "secret:GITHUB_TOKEN"
    token_env: GITHUB_TOKEN
    conventional_commits:
        enabled: true
        default_scope: core
    git_mutex_timeout: 30s
    git_operation_retries: 3
    git_retry_backoff: 500ms
sandbox:
    mode: host
    timeout_seconds: 600
    grace_period_seconds: 30
    test_command: make test
    linter_command: make lint
    formatter_command: make format
    exclude_paths:
        - build/
        - .noctifab/
        - .git/
    allowed_commands:
        - make
        - gcc
        - sqlite3
        - git
telemetry:
    enabled: false
    exporter: otlp
    endpoint: ""
    service_name: noctifab
    metrics:
        enabled: true
context:
    mode: full
    diff_window_lines: 15


