config_version: "1.0"
agents:
    architecture: single_pass
    max_tools_per_response: 10
    orchestrator:
        number: 1
        iterations: 2
    product_manager:
        number: 1
        iterations: 2
        max_user_stories: 5
    planner:
        number: 1
        iterations: 2
    architect:
        number: 1
        iterations: 2
    generators:
        number: 4
        iterations: 5
        providers:
            - name: gemini-primary
    testers:
        number: 2
        iterations: 3
        providers:
            - name: huggingface-kimi
    qa:
        number: 2
        iterations: 2
    security:
        number: 1
        iterations: 2
    performance:
        number: 1
        iterations: 2
    docs:
        number: 1
        iterations: 2
    devops:
        number: 1
        iterations: 2
    unblocker:
        number: 1
        iterations: 2
workspace_cache:
    enabled: true
poll_interval: 10s
max_clarification_wait: 30m0s
clarification_timeout_action: continue
storage:
    provider: sqlite
    conn_string: .noctifab/data/noctifab.db
    json_file_path: .noctifab/data/state.json
llm:
    priority:
        - opencode-primary
        - gemini-primary
        - huggingface-kimi
        - openrouter-backup
    providers:
        - name: opencode-primary
          provider: opencode
          model: latest
          api_keys: OPENCODE_API_KEY
          max_retries: 2
          retry_backoff: 50ms
          max_timeout: 25s
          idle_timeout: 8s
          streaming: true
        - name: gemini-primary
          provider: gemini
          model: latest
          api_keys: GEMINI_API_KEY
          max_retries: 2
          retry_backoff: 50ms
          max_timeout: 25s
          idle_timeout: 8s
          streaming: true
        - name: huggingface-kimi
          provider: huggingface
          model: latest
          api_keys: HUGGINGFACE_API_KEY
          max_retries: 2
          retry_backoff: 50ms
          max_timeout: 25s
          idle_timeout: 8s
          streaming: true
        - name: openrouter-backup
          provider: openrouter
          model: deepseek/deepseek-v4-flash-latest
          api_keys: OPENROUTER_API_KEY
          max_retries: 2
          retry_backoff: 50ms
          max_timeout: 25s
          idle_timeout: 8s
          streaming: true
vcs:
    provider: github
    repository: diegojromerolopez/fortune
    base_branch: main
    branch_prefix: noctifab/
    use_worktrees: true
    token: "secret:GITHUB_TOKEN"
    token_env: GITHUB_TOKEN
    conventional_commits:
        enabled: true
        default_scope: core
    git_mutex_timeout: 30s
    git_operation_retries: 3
    git_retry_backoff: 500ms
sandbox:
    mode: host
    timeout_seconds: 600
    grace_period_seconds: 30
    test_command: make test
    linter_command: make lint
    formatter_command: make format
    max_linter_retries: 3
    exclude_paths:
        - build/
        - .noctifab/
        - .git/
    allowed_commands:
        - make
        - gcc
        - sqlite3
        - git
telemetry:
    enabled: false
    exporter: otlp
    endpoint: ""
    service_name: noctifab
    metrics:
        enabled: true
context:
    mode: full
    diff_window_lines: 15
    compaction: simple_english


